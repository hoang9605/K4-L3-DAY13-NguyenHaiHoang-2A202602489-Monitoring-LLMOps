alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000 over the last 5m, with at least 5 responses'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602489
    runbook: docs/alerts.md#alert-1
  - name: HighRequestErrorRate
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2 over the last 5m, with at least 5 requests'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602489
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: 'count(tool_success == true) / count(tool_success != null) * 100 < 90 over the last 5m, with at least 5 tool attempts across response_sent and request_failed'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602489
    runbook: docs/alerts.md#alert-3
